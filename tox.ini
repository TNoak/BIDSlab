[tox]
requires =
    tox>=4.2
    tox-gh-actions
env_list =
    pre-commit
    clean
    report
    build
    sphinx
    py3.1{4, 3, 2}
skip_missing_interpreters = true
set_env =
    TEMP = {env_tmp_dir}

[testenv]
description = run the test suite
package = editable
wheel_build_env = .pkg
deps =
    datalad
commands =
    pytest {posargs:tests}
depends =
    py3.1{4, 3, 2}: clean
    report: py3.1{4, 3, 2}
dependency_groups = test
labels = test

[testenv:pre-commit]
description = run pre-commit hooks
base_python = py3.13
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files {posargs}
labels = lint, pre-commit

[testenv:clean]
description = clean up temporary files
base_python = py3.12
skip_install = true
deps =
    coverage
commands =
    coverage erase
labels = coverage

[testenv:report]
description = generate test coverage report
base_python = py3.12
skip_install = true
deps =
    coverage
commands =
    coverage report
    coverage xml
labels = coverage

[testenv:build]
description = build source and wheel packages
base_python = py3.12
skip_install = true
commands =
    python -m build --outdir dist
dependency_groups = build
labels = build, dist

[testenv:sphinx]
description = build the Sphinx documentation
base_python = py3.12
commands =
    python3 tools/generate_todos.py
    sphinx-build -b html docs/source docs/build/html
depends =
    pre-commit
dependency_groups = docs
labels = docs

[testenv:changelog]
description = generate changelog
base_python = py3.12
skip_install = true
deps =
    git-cliff
commands =
    git-cliff -o CHANGELOG.md
labels = changelog

[testenv:version]
description = generate version
base_python = py3.12
skip_install = true
deps =
    git-cliff
commands =
    git-cliff --bumped-version
labels = version

[testenv:numpydoc-lint]
description = lint numpydoc docstrings
base_python = py3.12
skip_install = true
deps =
    numpydoc
commands =
    numpydoc lint {toxinidir}/*.py
labels = lint, numpydoc

[testenv:ruff]
description = run ruff linter and formatter
base_python = py3.12
skip_install = true
deps =
    ruff
commands =
    ruff check --fix
    ruff format
labels = lint, format, ruff

[testenv:mypy]
description = run mypy type checker
base_python = py3.12
skip_install = true
commands =
    mypy src
dependency_groups = typing
labels = typing, mypy

[testenv:update]
description = update dependencies
base_python = py3.12
skip_install = true
commands =
    pre-commit autoupdate
labels = update, dependencies

[testenv:update-lock]
description = update uv.lock file
base_python = py3.12
skip_install = true
commands =
    uv lock
labels = lock, dependencies

[testenv:generate-requirements]
description = generate requirements.txt from pyproject.toml
base_python = py3.12
skip_install = true
commands =
    uv pip compile -q --no-deps -o requirements/default.txt pyproject.toml
    uv pip compile -q --no-deps --all-extras -o requirements/extra.txt pyproject.toml
    uv pip compile -q --no-deps -o requirements/test.txt --group test pyproject.toml
    uv pip compile -q --no-deps -o requirements/docs.txt --group docs pyproject.toml
    uv pip compile -q --no-deps -o requirements/lint.txt --group lint pyproject.toml
    uv pip compile -q --no-deps -o requirements/typing.txt --group typing pyproject.toml
    uv pip compile -q --no-deps -o requirements/build.txt --group build pyproject.toml
    uv pip compile -q --no-deps -o requirements/release.txt --group release pyproject.toml
    uv pip compile -q --no-deps -o requirements/tox.txt --group tox pyproject.toml
    uv pip compile -q --no-deps -o requirements/dev.txt --group dev pyproject.toml
allowlist_externals =
    uv
labels = requirements, dependencies

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314
