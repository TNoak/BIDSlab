---
defaults:
  run:
    shell: bash

name: CI
run-name: Run CI for ${{ github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: 'Version to release'
        required: false
        type: string
  workflow_dispatch:

jobs:
  run-lints:
    name: Lint Code
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/lint.yml

  run-tests:
    name: Run Tests
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/tests.yml

  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs: [run-lints, run-tests]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate a full changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        id: git-cliff-full
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.12

      - name: Format with mdformat
        run: |
          pip install mdformat mdformat-gfm
          mdformat CHANGELOG.md

      - name: Set target branch for changelog commit
        id: set-branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${INPUTS_VERSION}" != "" ]]; then
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Commit full changelog
        id: commit-changelog
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465
        with:
          commit_message: "chore: update changelog"
          repo: ${{ github.repository }}
          branch: ${{ steps.set-branch.outputs.branch }}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Generate a release changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        if: ${{ inputs.version }}
        id: git-cliff-release
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload changelog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ inputs.version }}
        id: upload-changelog
        with:
          name: Changes
          path: CHANGES.md
          if-no-files-found: error

  dist:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    needs: generate-changelog
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and inspect the Python package
        uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10

  install:
    name: Check version
    runs-on: ubuntu-latest
    needs: dist
    if: always()
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Get artifacts from dist job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Packages
          path: ./dist

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.12

      - name: Install the built package
        id: install-package
        run: |
          pip install dist/bidslab-*.whl
          version=$(python -c "import bidslab; print(bidslab.get_version())")
          echo "Installed BIDSlab version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if the installed package version matches the workflow input
        if: ${{ inputs.version && inputs.version != '' }}
        id: check-version
        run: |
          if [[ "$version" != "${INPUTS_VERSION}" ]]; then
            echo "Version mismatch: Installed BIDSlab has version $version
            but workflow input is ${INPUTS_VERSION}"
            exit 1
          fi
        env:
          version: ${{ steps.install-package.outputs.version }}
          INPUTS_VERSION: ${{ inputs.version }}
