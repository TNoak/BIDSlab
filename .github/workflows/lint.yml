---
defaults:
  run:
    shell: bash

name: Lint
run-name: Run Lints for ${{ github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-lint
  cancel-in-progress: true

on:
  push:
    branches:
      # - main # runs via ci.yml, so we can run lint on dev only here
      - dev
  pull_request:
    branches:
      # - main # runs via ci.yml, so we can run lint on dev only here
      - dev
  workflow_call:
  workflow_dispatch:

jobs:
  lint-code:
    name: Lint Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.12

      - name: Run Ruff
        id: ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89

  mypy:
    name: Type Check Code
    runs-on: ubuntu-latest
    needs: lint-code
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.12

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - run: uv tool install mypy

      - run: mypy .
