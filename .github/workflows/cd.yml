---
defaults:
  run:
    shell: bash

name: CD
run-name: Release ${{ github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-cd
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.clean_tag.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Strip leading 'v' from tag
        id: clean_tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: Run CI workflow
    needs: prepare
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish-pypi:
    name: Make a PyPI Release
    runs-on: ubuntu-latest
    needs: ci
    if: always()
    permissions:
      id-token: write
    environment:
      name: publish-package
      url: https://pypi.org/p/BIDSlab
    steps:
      - name: Collect built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Packages
          path: ./dist

      - name: Publish Python distribution to (Test) PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          # repository-url: https://test.pypi.org/legacy/
          print-hash: true

  publish-github:
    name: Make a GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    if: always()
    environment:
      name: publish-release
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Collect built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Packages
          path: ./dist

      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "dist/bidslab-*"

      - name: Verify artifact attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for artifact in dist/*; do
              echo "# ${artifact}"
              gh attestation verify "${artifact}" --repo ${{ github.repository }}
          done

      - name: Collect changelog for release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Changes

      - name: Publish Python distribution to GitHub Releases
        run: gh release create ${GITHUB_REF_NAME} dist/* -F CHANGES.md
        env:
          GH_TOKEN: ${{ github.token }}
