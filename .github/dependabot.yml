---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # Maintain dependencies for Python packages via uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      uv:
        patterns:
          - "*"
    cooldown:
      default-days: 7
